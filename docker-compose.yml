services:
  appzplay-landing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appzplay-landing
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.appzplay.rule=Host(`appzplay.online`) || Host(`www.appzplay.online`)"
      - "traefik.http.routers.appzplay.entrypoints=websecure"
      - "traefik.http.routers.appzplay.tls.certresolver=letsencrypt"
      - "traefik.http.services.appzplay.loadbalancer.server.port=80"
    networks:
      - coolify

networks:
  coolify:
    external: true
